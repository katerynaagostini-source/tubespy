<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TubeSpy — YouTube Niche Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#4F46E5;--blue-light:#EEF2FF;--blue-dark:#3730A3;
  --green:#10B981;--green-light:#D1FAE5;
  --dark:#0F172A;--dark2:#1E293B;--gray:#64748B;--gray2:#94A3B8;
  --light:#F8FAFC;--border:#E2E8F0;--border2:#CBD5E1;
  --orange:#F59E0B;--red:#EF4444;--red-light:#FEE2E2;
  --sidebar:260px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -1px rgba(0,0,0,.06);
  --shadow-lg:0 10px 25px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);
  --radius:12px;--radius-lg:16px;--radius-xl:20px;
}
html{font-size:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--light);color:var(--dark);display:flex;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

/* ── ANIMATED BACKGROUND ── */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(79,70,229,.06) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(16,185,129,.04) 0%,transparent 60%);pointer-events:none;z-index:0}

/* ── SIDEBAR ── */
#sb{width:var(--sidebar);min-height:100vh;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:100;box-shadow:var(--shadow)}
.logo{padding:20px 18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#EF4444,#DC2626);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(239,68,68,.35)}
.logo-text{font-size:18px;font-weight:900;color:var(--dark);letter-spacing:-0.5px}
.logo-check{color:#EF4444}
.plan-tag{font-size:10px;font-weight:700;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:3px 8px;border-radius:99px;margin-left:auto;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sb-back{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;color:var(--gray);cursor:pointer;border-radius:8px;margin:0 8px;transition:all .15s}
.sb-back:hover{background:var(--light);color:var(--dark)}
.sb-section{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--gray2);padding:14px 18px 6px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:1px 8px;font-size:13px;font-weight:500;color:var(--gray);cursor:pointer;border-radius:8px;transition:all .15s;position:relative}
.sb-item:hover{background:var(--blue-light);color:var(--blue-dark)}
.sb-item.active{background:linear-gradient(135deg,var(--blue-light),#E0E7FF);color:var(--blue);font-weight:600;box-shadow:var(--shadow-sm)}
.sb-item.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--blue);border-radius:0 3px 3px 0}
.sb-badge{font-size:9px;font-weight:800;background:linear-gradient(135deg,#10B981,#059669);color:#fff;padding:2px 6px;border-radius:99px;margin-left:auto;text-transform:uppercase;letter-spacing:.04em}
.sb-foot{border-top:1px solid var(--border);padding:12px 8px}
.help-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--gray);width:100%;transition:background .15s}
.help-btn:hover{background:var(--light)}
.help-drop{display:none;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px;margin-top:4px;box-shadow:var(--shadow-lg)}
.help-drop.open{display:block}
.help-link{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--gray);border-radius:6px;cursor:pointer;transition:all .15s}
.help-link:hover{background:var(--light);color:var(--dark)}

/* ── MAIN ── */
#main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}
.topbar{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--border)}
.bread{font-size:13px;color:var(--gray);display:flex;align-items:center;gap:6px}
.bread b{color:var(--dark);font-weight:600}
.bread-sep{color:var(--border2)}
.topbar-r{display:flex;align-items:center;gap:10px}
.topbar-stat{background:var(--light);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--gray);display:flex;align-items:center;gap:6px}
.topbar-stat .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
.discord-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;background:#5865F2;color:#fff;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .15s;box-shadow:0 2px 8px rgba(88,101,242,.3)}
.discord-btn:hover{background:#4752C4;transform:translateY(-1px)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#7C3AED);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(79,70,229,.3);transition:transform .15s}
.avatar:hover{transform:scale(1.05)}
.content{flex:1;padding:28px 32px}

/* ── API KEY BANNER ── */
.api-banner{background:linear-gradient(135deg,#1E293B,var(--blue));color:#fff;border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow-lg);position:relative;overflow:visible;z-index:2}
.api-banner::after{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
.api-banner input{flex:1;min-width:240px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;outline:none;font-family:monospace;transition:border .2s}
.api-banner input::placeholder{color:rgba(255,255,255,.5)}
.api-banner input:focus{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.18)}
.btn-save-key{background:#fff;color:var(--blue);border:none;padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s;box-shadow:var(--shadow);position:relative;z-index:51}
.btn-save-key:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.api-ok{background:var(--green-light);color:#065F46;border:1px solid #A7F3D0;border-radius:var(--radius);padding:10px 16px;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:8px;font-weight:500}

/* ── SEARCH BAR ── */
.search-row{display:flex;gap:10px;margin-bottom:18px;align-items:center}
.search-sel{border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;background:#fff;cursor:pointer;min-width:110px;color:var(--dark);font-weight:500;transition:border .2s}
.search-sel:focus{border-color:var(--blue);outline:none}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 14px 10px 40px;font-size:13px;background:#fff;outline:none;transition:all .2s;box-shadow:var(--shadow-sm);font-family:inherit}
.search-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.search-wrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--gray2);font-size:15px;pointer-events:none}
.btn-search{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .2s;box-shadow:0 2px 8px rgba(79,70,229,.3);font-family:inherit}
.btn-search:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(79,70,229,.4)}
.btn-search:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── FILTER TABS ── */
.ftabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ftab{padding:6px 14px;border-radius:99px;border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:var(--gray);white-space:nowrap;transition:all .15s}
.ftab:hover{border-color:var(--blue);color:var(--blue)}
.ftab.active{background:var(--dark);color:#fff;border-color:var(--dark);box-shadow:var(--shadow-sm)}

/* ── SORT BAR ── */
.sort-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:center;padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--border)}
.sort-btn{font-size:12px;font-weight:500;color:var(--gray);cursor:pointer;background:none;border:none;display:flex;align-items:center;gap:4px;padding:2px 0;transition:color .15s;font-family:inherit}
.sort-btn:hover{color:var(--dark)}
.sort-btn.active{color:var(--blue);font-weight:600}

/* ── CHANNEL CARD ── */
.ch-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:12px;transition:all .2s;box-shadow:var(--shadow-sm)}
.ch-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);border-color:var(--border2)}
.ch-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ch-av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0;overflow:hidden;box-shadow:var(--shadow)}
.ch-av img{width:100%;height:100%;object-fit:cover}
.ch-name{font-size:15px;font-weight:700}
.ch-subs{font-size:12px;color:var(--gray);margin-top:2px}
.ch-actions{margin-left:auto;display:flex;gap:6px}
.ico-btn{background:none;border:1px solid var(--border);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all .15s;color:var(--gray)}
.ico-btn:hover{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.met{background:linear-gradient(135deg,var(--light),#fff);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:all .2s}
.met:hover{border-color:var(--blue);background:var(--blue-light)}
.met-lbl{font-size:11px;color:var(--gray);margin-bottom:5px;font-weight:500;display:flex;align-items:center;gap:4px}
.met-val{font-size:18px;font-weight:800;color:var(--dark)}
.outlier-wrap{display:flex;align-items:center;gap:8px}
.o-bars{display:flex;gap:3px}
.o-bar{height:7px;width:20px;border-radius:4px;background:var(--border);transition:all .3s}
.o-bar.red{background:linear-gradient(135deg,#EF4444,#DC2626)}
.o-bar.orange{background:linear-gradient(135deg,#F59E0B,#D97706)}
.o-bar.green{background:linear-gradient(135deg,#10B981,#059669)}
.o-num{font-size:17px;font-weight:800}
.ai-tag{background:linear-gradient(135deg,var(--blue-light),#E0E7FF);color:var(--blue);font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid rgba(79,70,229,.2)}

/* ── VIDEOS EXPAND ── */
.ch-vids{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;display:none}
.ch-vids.open{display:block}
.vids-lbl{font-size:12px;font-weight:600;color:var(--gray);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.vids-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.vid-item{cursor:pointer;border-radius:8px;overflow:hidden;border:1px solid var(--border);transition:all .2s;background:#fff}
.vid-item:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.vid-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e5e7eb}
.vid-title{font-size:11px;color:var(--dark);padding:6px 8px 2px;line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid-views{font-size:10px;color:var(--gray2);padding:0 8px 6px}

/* ── KEYWORD CARD ── */
.kw-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:all .2s}
.kw-card:hover{box-shadow:var(--shadow);border-color:var(--border2)}
.kw-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.kw-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ── CHANNEL TRACKER ── */
.tracker-input-row{display:flex;gap:10px;margin-bottom:18px}
.tracker-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;outline:none;font-family:inherit;transition:border .2s;box-shadow:var(--shadow-sm)}
.tracker-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.tracked-list{display:flex;flex-direction:column;gap:10px}
.tracked-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;box-shadow:var(--shadow-sm);transition:all .2s}
.tracked-item:hover{box-shadow:var(--shadow);border-color:var(--border2)}
.tracked-head{display:flex;align-items:center;gap:12px}
.tracked-del{background:none;border:none;cursor:pointer;color:var(--gray2);font-size:18px;margin-left:auto;transition:color .15s;padding:4px 8px;border-radius:6px}
.tracked-del:hover{color:var(--red);background:var(--red-light)}
.tracked-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tstat{background:var(--light);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.tstat-lbl{font-size:11px;color:var(--gray);margin-bottom:4px;font-weight:500}
.tstat-val{font-size:17px;font-weight:800}

/* ── CHANNEL DETAIL PANEL ── */
.ch-detail{background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);margin-top:14px;overflow:hidden;animation:slideDown .3s ease}
@keyframes slideDown{from{opacity:0;max-height:0;transform:translateY(-8px)}to{opacity:1;max-height:3000px;transform:translateY(0)}}
.ch-detail-header{background:linear-gradient(135deg,var(--dark),var(--dark2));padding:24px 28px;display:flex;gap:18px;align-items:flex-start}
.ch-detail-avatar{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.2);object-fit:cover;flex-shrink:0}
.ch-detail-info{flex:1;color:#fff}
.ch-detail-info h3{font-size:20px;font-weight:800;margin-bottom:4px}
.ch-detail-info .ch-desc{font-size:12px;color:var(--gray2);margin-top:6px;line-height:1.5}
.ch-detail-info .ch-meta{font-size:12px;color:var(--gray2);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
.ch-detail-info .ch-meta span{display:flex;align-items:center;gap:4px}
.ch-detail-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:18px 28px;border-bottom:1px solid var(--border)}
.ch-detail-stat{text-align:center;padding:12px 8px;background:var(--light);border-radius:10px}
.ch-detail-stat .val{font-size:18px;font-weight:800;color:var(--dark)}
.ch-detail-stat .lbl{font-size:11px;color:var(--gray);margin-top:4px;font-weight:500}
.ch-detail-section{padding:20px 28px;border-bottom:1px solid var(--border)}
.ch-detail-section h4{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.vid-card{background:var(--light);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all .2s;cursor:pointer;text-decoration:none;color:inherit}
.vid-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--border2)}
.vid-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.vid-card .vid-info{padding:10px 12px}
.vid-card .vid-title{font-size:12px;font-weight:600;color:var(--dark);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid-card .vid-views{font-size:11px;color:var(--gray);margin-top:5px;font-weight:500}
.rev-chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding:14px 0}
.rev-bar{flex:1;background:linear-gradient(180deg,var(--blue),var(--blue-dark));border-radius:6px 6px 0 0;position:relative;min-height:4px;transition:height .4s ease}
.rev-bar:hover{opacity:.85}
.rev-bar .rev-val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--dark);white-space:nowrap}
.rev-bar .rev-month{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gray);white-space:nowrap}
.ch-detail-close{position:absolute;top:12px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.ch-detail-close:hover{background:rgba(255,255,255,.3)}
.growth-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.growth-up{background:var(--green-light);color:#065F46}
.growth-neutral{background:var(--blue-light);color:var(--blue)}
@media(max-width:640px){
  .ch-detail-stats{grid-template-columns:repeat(3,1fr)}
  .vid-grid{grid-template-columns:repeat(2,1fr)}
  .ch-detail-header{flex-direction:column;align-items:center;text-align:center}
  .tracked-stats{grid-template-columns:repeat(3,1fr)!important}
  .rev-chart{height:100px}
  .rev-bar .rev-val{font-size:8px}
}

/* ── RPM ── */
.rpm-table{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.rpm-table table{width:100%;border-collapse:collapse}
.rpm-table th{background:var(--light);padding:12px 18px;text-align:left;font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.04em}
.rpm-table td{padding:12px 18px;border-top:1px solid var(--border);font-size:13px;font-weight:500}
.rpm-table tr:hover td{background:#FAFBFF}
.rpm-high{color:var(--green);font-weight:700}
.rpm-mid{color:var(--orange);font-weight:700}
.rpm-low{color:var(--red);font-weight:700}
.rpm-calc{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm)}
.rpm-calc h3{font-size:15px;font-weight:700;margin-bottom:16px}
.calc-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.calc-field{flex:1;min-width:160px}
.calc-field label{display:block;font-size:11px;color:var(--gray);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.calc-field input,.calc-field select{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:13px;outline:none;font-family:inherit;transition:border .2s}
.calc-field input:focus,.calc-field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.rpm-result{background:linear-gradient(135deg,var(--blue-light),#E0E7FF);border-radius:12px;padding:20px;text-align:center;border:1px solid rgba(79,70,229,.15)}
.rpm-result-val{font-size:32px;font-weight:900;color:var(--blue)}
.rpm-result-lbl{font-size:12px;color:var(--gray);margin-top:6px}

/* ── THUMBNAIL SEARCH ── */
.thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.thumb-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.thumb-card:hover{box-shadow:var(--shadow-xl);transform:translateY(-3px);border-color:var(--border2)}
.thumb-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.thumb-info{padding:12px 14px}
.thumb-title{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;color:var(--dark)}
.thumb-meta{font-size:11px;color:var(--gray);display:flex;gap:10px}

/* ── DASHBOARD ── */
.welcome-h{font-size:22px;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--dark),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome-sub{font-size:13px;color:var(--gray);margin-bottom:24px;display:flex;align-items:center;gap:8px}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:22px}
.dash-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;cursor:pointer;transition:all .25s;box-shadow:var(--shadow-sm)}
.dash-card:hover{box-shadow:var(--shadow-xl);transform:translateY(-3px);border-color:var(--border2)}
.dash-preview{height:200px;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative;overflow:hidden}
.dash-preview::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.05))}
.dash-body{padding:18px 20px}
.dash-body h3{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--dark)}
.dash-body p{font-size:13px;color:var(--gray);margin-bottom:14px;line-height:1.55}
.dash-features li{font-size:13px;color:var(--dark2);display:flex;gap:8px;margin-bottom:7px;line-height:1.45}

/* ── STATS TICKER ── */
.stats-ticker{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);transition:all .2s;position:relative;overflow:hidden}
.stat-box:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-color,var(--blue));border-radius:var(--radius) var(--radius) 0 0}
.stat-box-val{font-size:24px;font-weight:900;margin-bottom:2px}
.stat-box-lbl{font-size:11px;color:var(--gray);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.stat-box-delta{font-size:11px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:3px}
.stat-box-delta.up{color:var(--green)}
.stat-box-delta.down{color:var(--red)}

/* ── OVERVIEW ── */
.ov-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.ov-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ov-title{font-size:15px;font-weight:700}
.ov-sub{font-size:12px;color:var(--gray);margin-top:2px;display:flex;align-items:center;gap:4px}
.view-all{font-size:12px;color:var(--blue);font-weight:600;cursor:pointer;transition:color .15s}
.view-all:hover{color:var(--blue-dark)}
.ov-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}
.ov-row:last-child{border-bottom:none}
.ov-row:hover{background:var(--light);margin:0 -22px;padding:10px 22px;border-radius:8px}
.ov-av{width:40px;height:40px;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow-sm)}
.ov-av img{width:100%;height:100%;object-fit:cover}
.ov-name{font-size:14px;font-weight:600;color:var(--dark)}
.ov-subs{font-size:11px;color:var(--gray);margin-top:1px}
.ov-score{margin-left:auto;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}

/* ── N8N ── */
.wf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.wf-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.wf-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--blue)}
.wf-icon{font-size:26px;margin-bottom:10px}
.wf-name{font-size:14px;font-weight:700;margin-bottom:6px;color:var(--dark)}
.wf-desc{font-size:12px;color:var(--gray);line-height:1.5;margin-bottom:12px}
.btn-dl{font-size:12px;color:var(--blue);background:var(--blue-light);border:1px solid rgba(79,70,229,.2);padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:600;transition:all .15s}
.btn-dl:hover{background:var(--blue);color:#fff}

/* ── MCP ── */
.mcp-hero{background:linear-gradient(135deg,#0F172A,#1E3A8A);border-radius:var(--radius-xl);padding:28px;color:#fff;margin-bottom:18px;box-shadow:var(--shadow-xl);position:relative;overflow:hidden}
.mcp-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:rgba(79,70,229,.2);border-radius:50%;filter:blur(40px)}
.mcp-code{background:rgba(0,0,0,.4);color:#22D3EE;border-radius:10px;padding:16px 20px;font-family:'Fira Code',monospace;font-size:12px;margin-top:14px;border:1px solid rgba(255,255,255,.1);white-space:pre;overflow-x:auto;line-height:1.6}
.mcp-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mcp-tool{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all .2s;box-shadow:var(--shadow-sm)}
.mcp-tool:hover{box-shadow:var(--shadow);border-color:var(--blue)}
.mcp-tool h4{font-size:12px;font-weight:700;margin-bottom:5px;color:var(--blue);font-family:'Fira Code',monospace}
.mcp-tool p{font-size:12px;color:var(--gray);line-height:1.5}

/* ── ACCOUNT ── */
.acct-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:22px}
.acct-tab{padding:10px 22px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--gray);margin-bottom:-2px;transition:all .15s}
.acct-tab:hover{color:var(--dark)}
.acct-tab.active{border-bottom-color:var(--blue);color:var(--blue);font-weight:700}
.profile-box{background:linear-gradient(135deg,#fff,var(--blue-light));border:1px solid var(--border);border-radius:var(--radius-xl);padding:28px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.p-av{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#7C3AED);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 8px 24px rgba(79,70,229,.35);overflow:hidden}
.p-av img{width:100%;height:100%;object-fit:cover}
.p-name{font-size:17px;font-weight:800;color:var(--dark)}
.p-since{font-size:12px;color:var(--gray);margin-top:4px}
.detail-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.detail-box h3{font-size:14px;font-weight:700;margin-bottom:18px;color:var(--dark);display:flex;align-items:center;gap:8px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.d-field label{font-size:11px;color:var(--gray);display:block;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.d-val{font-size:14px;font-weight:500;border-bottom:1px solid var(--border);padding-bottom:8px;color:var(--dark)}
.free-badge{background:linear-gradient(135deg,#FEE2E2,#FECACA);color:#991B1B;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;display:inline-block;border:1px solid #FCA5A5}

/* ── STATES ── */
.loading{display:flex;align-items:center;gap:12px;padding:32px;color:var(--gray);font-size:13px;font-weight:500}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:56px 24px;color:var(--gray)}
.empty h3{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--dark)}
.empty p{font-size:13px;line-height:1.6}
.error-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--radius);padding:14px 18px;font-size:13px;color:#991B1B;margin-bottom:18px;display:flex;align-items:center;gap:8px}

/* ── UTILITY ── */
.tag-green{background:var(--green-light);color:#065F46;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid #A7F3D0}
.tag-blue{background:var(--blue-light);color:var(--blue);font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid rgba(79,70,229,.2)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(79,70,229,.3);font-family:inherit}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(79,70,229,.4)}

/* ── FAQ ── */
.faq-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-sm);transition:all .2s}
.faq-item:hover{box-shadow:var(--shadow);border-color:var(--border2)}
.faq-q{padding:16px 20px;font-size:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--dark);transition:background .15s}
.faq-q:hover{background:var(--light)}
.faq-a{display:none;padding:0 20px 16px;font-size:13px;color:var(--gray);line-height:1.7}
.faq-a.open{display:block}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gray2)}

/* ── TRANSITIONS ── */
.content > *{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* SIDEBAR */
#sb{width:var(--sidebar);min-height:100vh;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:100}
.logo{padding:18px 20px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.logo-text{font-size:22px;font-weight:900;color:#0f0f0f;letter-spacing:-1px}
.logo-check{color:#EF4444}
.plan-tag{font-size:11px;font-weight:700;background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:99px;margin-left:4px}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.sb-back{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:14px;color:var(--gray);cursor:pointer}
.sb-back:hover{color:var(--dark)}
.sb-section{font-size:11px;font-weight:700;letter-spacing:.08em;color:#9CA3AF;padding:12px 20px 6px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:15px;color:#374151;cursor:pointer;transition:all .15s}
.sb-item:hover{background:var(--light);color:var(--dark)}
.sb-item.active{background:var(--blue-light);color:var(--blue);font-weight:600}
.sb-badge{font-size:10px;font-weight:700;background:#d1fae5;color:#065f46;padding:2px 7px;border-radius:99px;margin-left:auto}
.sb-foot{border-top:1px solid var(--border);padding:10px}
.help-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--gray);width:100%}
.help-btn:hover{background:var(--light)}
.help-drop{display:none;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px;margin-top:4px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.help-drop.open{display:block}
.help-link{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--gray);border-radius:6px;cursor:pointer}
.help-link:hover{background:var(--light);color:var(--dark)}

/* MAIN */
#main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.bread{font-size:14px;color:var(--gray)}
.bread b{color:var(--dark)}
.topbar-r{display:flex;align-items:center;gap:12px}
.discord-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;background:#5865F2;color:#fff;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;text-decoration:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.content{flex:1;padding:24px 28px}

/* API KEY BANNER */
.api-banner{background:linear-gradient(135deg,#1e3a8a,var(--blue));color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;overflow:visible;z-index:2}
.api-banner input{flex:1;min-width:240px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
.api-banner input::placeholder{color:rgba(255,255,255,.6)}
.api-banner input:focus{border-color:#fff}
.btn-save-key{background:#fff;color:var(--blue);border:none;padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;position:relative;z-index:51;transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn-save-key:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-save-key:active{transform:translateY(0);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.api-ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;border-radius:12px;padding:10px 16px;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:8px}

/* SEARCH BAR */
.search-row{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.search-sel{border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:14px;background:#fff;cursor:pointer;min-width:110px}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 14px 9px 38px;font-size:14px;background:#fff;outline:none}
.search-wrap input:focus{border-color:var(--blue)}
.search-wrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:14px}
.btn-search{background:var(--blue);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-search:hover{background:#2d3fd0}
.btn-search:disabled{opacity:.5;cursor:not-allowed}

/* FILTER TABS */
.ftabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ftab{padding:6px 14px;border-radius:99px;border:1px solid var(--border);font-size:13px;cursor:pointer;background:#fff;color:var(--gray);white-space:nowrap;transition:all .15s}
.ftab.active{background:var(--dark);color:#fff;border-color:var(--dark)}

/* SORT BAR */
.sort-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.sort-btn{font-size:13px;color:var(--gray);cursor:pointer;background:none;border:none;display:flex;align-items:center;gap:4px}
.sort-btn:hover{color:var(--dark)}
.sort-btn.active{color:var(--dark);font-weight:600}

/* CHANNEL CARD */
.ch-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:12px}
.ch-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ch-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0;overflow:hidden}
.ch-av img{width:100%;height:100%;object-fit:cover}
.ch-name{font-size:15px;font-weight:700}
.ch-subs{font-size:13px;color:var(--gray)}
.ch-actions{margin-left:auto;display:flex;gap:6px}
.ico-btn{background:none;border:1px solid var(--border);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.ico-btn:hover{background:var(--light)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.met{background:var(--light);border-radius:8px;padding:10px 12px}
.met-lbl{font-size:12px;color:var(--gray);margin-bottom:4px}
.met-val{font-size:17px;font-weight:700}
.outlier-wrap{display:flex;align-items:center;gap:8px}
.o-bars{display:flex;gap:3px}
.o-bar{height:7px;width:22px;border-radius:3px;background:#E5E7EB}
.o-bar.red{background:var(--red)}
.o-bar.orange{background:var(--orange)}
.o-bar.green{background:var(--green)}
.o-num{font-size:16px;font-weight:700}
.ai-tag{background:var(--blue-light);color:var(--blue);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}

/* VIDEOS EXPAND */
.ch-vids{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;display:none}
.ch-vids.open{display:block}
.vids-lbl{font-size:13px;font-weight:600;color:var(--gray);margin-bottom:8px}
.vids-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vid-item{cursor:pointer}
.vid-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#e5e7eb;display:block}
.vid-title{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid-views{font-size:11px;color:#9CA3AF;margin-top:2px}

/* KEYWORD CARD */
.kw-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:12px}
.kw-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.kw-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* CHANNEL TRACKER */
.tracker-input-row{display:flex;gap:10px;margin-bottom:16px}
.tracker-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:14px;outline:none}
.tracker-input:focus{border-color:var(--blue)}
.tracked-list{display:flex;flex-direction:column;gap:10px}
.tracked-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.tracked-head{display:flex;align-items:center;gap:12px}
.tracked-del{background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:18px;margin-left:auto}
.tracked-del:hover{color:var(--red)}
.tracked-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tstat{background:var(--light);border-radius:8px;padding:10px 12px}
.tstat-lbl{font-size:12px;color:var(--gray);margin-bottom:4px}
.tstat-val{font-size:16px;font-weight:700}

/* RPM TABLE */
.rpm-table{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.rpm-table table{width:100%;border-collapse:collapse}
.rpm-table th{background:var(--light);padding:12px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--gray)}
.rpm-table td{padding:12px 16px;border-top:1px solid var(--border);font-size:14px}
.rpm-table tr:hover td{background:#fafafa}
.rpm-high{color:var(--green);font-weight:700}
.rpm-mid{color:var(--orange);font-weight:700}
.rpm-low{color:var(--red);font-weight:700}
.rpm-calc{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px}
.rpm-calc h3{font-size:15px;font-weight:700;margin-bottom:14px}
.calc-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.calc-field{flex:1;min-width:160px}
.calc-field label{display:block;font-size:12px;color:var(--gray);margin-bottom:6px;font-weight:600}
.calc-field input,.calc-field select{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;outline:none}
.calc-field input:focus,.calc-field select:focus{border-color:var(--blue)}
.rpm-result{background:var(--blue-light);border-radius:10px;padding:16px;text-align:center}
.rpm-result-val{font-size:28px;font-weight:800;color:var(--blue)}
.rpm-result-lbl{font-size:13px;color:var(--gray);margin-top:4px}

/* THUMBNAIL SEARCH */
.thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.thumb-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .2s}
.thumb-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let PAGE = 'dashboard';
let YT_KEY = localStorage.getItem('yt_api_key') || '';
let trackedChannels = JSON.parse(localStorage.getItem('tracked_channels') || '[]');
let acctTab = 'profile';
let sortBy = 'outlier';
let sortDir = -1;
let allResults = [];
let filterMode = 'all';

// ── YOUTUBE API ────────────────────────────────────────────────────────────
const YT = 'https://www.googleapis.com/youtube/v3';

async function ytFetch(endpoint, params) {
  if (!YT_KEY) throw new Error('No API key');
  const url = new URL(YT + endpoint);
  Object.entries({...params, key: YT_KEY}).forEach(([k,v]) => url.searchParams.set(k, v));
  const r = await fetch(url);
  if (!r.ok) {
    const e = await r.json();
    throw new Error(e?.error?.message || 'YouTube API error');
  }
  return r.json();
}

async function searchChannels(query, maxResults = 12) {
  const search = await ytFetch('/search', {
    part: 'snippet', type: 'channel', q: query,
    maxResults, order: 'relevance'
  });
  const ids = search.items.map(i => i.snippet.channelId).join(',');
  if (!ids) return [];
  const stats = await ytFetch('/channels', {
    part: 'statistics,snippet,contentDetails', id: ids
  });
  return stats.items.map(ch => buildChannelObj(ch));
}

async function getChannelById(id) {
  const r = await ytFetch('/channels', {
    part: 'statistics,snippet,brandingSettings', id
  });
  if (!r.items?.length) throw new Error('Channel not found');
  return buildChannelObj(r.items[0]);
}

async function getChannelByUrl(input) {
  // Handle @handle, channel URL, or channel ID
  let id = input.trim();
  if (id.includes('youtube.com/channel/')) {
    id = id.split('youtube.com/channel/')[1].split('/')[0].split('?')[0];
    return getChannelById(id);
  }
  if (id.includes('youtube.com/@') || id.startsWith('@')) {
    const handle = id.includes('@') ? id.split('@').pop().split('/')[0].split('?')[0] : id;
    const r = await ytFetch('/channels', { part: 'statistics,snippet,brandingSettings', forHandle: '@' + handle });
    if (!r.items?.length) throw new Error('Channel not found');
    return buildChannelObj(r.items[0]);
  }
  if (id.startsWith('UC') && id.length > 20) return getChannelById(id);
  // Try as search
  const results = await searchChannels(id, 1);
  if (!results.length) throw new Error('Channel not found');
  return results[0];
}

async function getChannelVideos(channelId, maxResults = 8) {
  try {
    const search = await ytFetch('/search', {
      part: 'snippet', channelId, type: 'video',
      maxResults, order: 'viewCount'
    });
    const vids = search.items || [];
    if (!vids.length) return [];
    const ids = vids.map(v => v.id.videoId).join(',');
    const stats = await ytFetch('/videos', { part: 'statistics,snippet', id: ids });
    return (stats.items || []).map(v => ({
      id: v.id,
      title: v.snippet.title,
      thumb: v.snippet.thumbnails?.medium?.url || v.snippet.thumbnails?.default?.url,
      views: parseInt(v.statistics.viewCount || 0),
      likes: parseInt(v.statistics.likeCount || 0),
      comments: parseInt(v.statistics.commentCount || 0),
      viewsFmt: fmtNum(parseInt(v.statistics.viewCount || 0)),
      published: v.snippet.publishedAt
    }));
  } catch { return []; }
}

async function getRecentVideos(channelId, maxResults = 8) {
  try {
    const search = await ytFetch('/search', {
      part: 'snippet', channelId, type: 'video',
      maxResults, order: 'date'
    });
    const vids = search.items || [];
    if (!vids.length) return [];
    const ids = vids.map(v => v.id.videoId).join(',');
    const stats = await ytFetch('/videos', { part: 'statistics,snippet', id: ids });
    return (stats.items || []).map(v => ({
      id: v.id,
      title: v.snippet.title,
      thumb: v.snippet.thumbnails?.medium?.url || v.snippet.thumbnails?.default?.url,
      views: parseInt(v.statistics.viewCount || 0),
      likes: parseInt(v.statistics.likeCount || 0),
      comments: parseInt(v.statistics.commentCount || 0),
      viewsFmt: fmtNum(parseInt(v.statistics.viewCount || 0)),
      published: v.snippet.publishedAt
    }));
  } catch { return []; }
}

function estimateMonthlyRevenue(totalViews, videoCount, daysSince, niche = 'general') {
  const rpm = niche === 'general' ? 4 : 8;
  const viewsPerMonth = daysSince > 0 ? (totalViews / daysSince) * 30 : 0;
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const factor = 0.6 + Math.random() * 0.8;
    const mv = viewsPerMonth * factor;
    const rev = (mv / 1000) * rpm;
    const d = new Date();
    d.setMonth(d.getMonth() - i);
    months.push({ month: d.toLocaleString('fr', { month: 'short' }), revenue: Math.round(rev), views: Math.round(mv) });
  }
  return months;
}

async function expandChannel(idx) {
  const ch = trackedChannels[idx];
  if (!ch) return;
  const detailEl = document.getElementById(`detail-${idx}`);
  if (detailEl) { detailEl.remove(); return; }
  // Remove other open details
  document.querySelectorAll('.ch-detail').forEach(el => el.remove());
  const parent = document.getElementById(`tracked-${idx}`);

      getChannelVideos(ch.id, 8),
      getRecentVideos(ch.id, 8)

    const revenue = estimateMonthlyRevenue(ch.totalViews, ch.videoCount, ch.daysSince);
    const maxRev = Math.max(...revenue.map(r => r.revenue), 1);
    const totalEstRev = revenue.reduce((s, r) => s + r.revenue, 0);
    const avgEngagement = topVids.length ? (topVids.reduce((s, v) => s + v.likes, 0) / topVids.reduce((s, v) => s + v.views, 0) * 100).toFixed(1) : '0';
    const viewsPerVideo = ch.videoCount > 0 ? Math.round(ch.totalViews / ch.videoCount) : 0;
    const uploadsPerMonth = ch.daysSince > 30 ? Math.round(ch.videoCount / (ch.daysSince / 30)) : ch.videoCount;

    const html = `
      <div class="ch-detail" id="detail-${idx}">
        <div class="ch-detail-header" style="position:relative">
          <button class="ch-detail-close" onclick="document.getElementById('detail-${idx}').remove()">✕</button>
          <img class="ch-detail-avatar" src="${ch.avatar || ''}" alt="${ch.name}" onerror="this.style.background='${ch.color}';this.src=''">
          <div class="ch-detail-info">
            <h3>${ch.name}</h3>
            <div style="font-size:13px;color:#94a3b8">${ch.subs} abonnes</div>
            ${ch.desc ? `<div class="ch-desc">${ch.desc}</div>` : ''}
            <div class="ch-meta">
              <span>📅 Creee il y a ${Math.round(ch.daysSince / 365)} ans</span>
              <span>🎬 ${ch.videoCount} videos</span>
              <span>👁 ${fmtNum(ch.totalViews)} vues totales</span>
            </div>
          </div>
        </div>

        <div class="ch-detail-stats">
          <div class="ch-detail-stat"><div class="val">${ch.subs}</div><div class="lbl">Abonnes</div></div>
          <div class="ch-detail-stat"><div class="val">${fmtNum(ch.totalViews)}</div><div class="lbl">Vues Totales</div></div>
          <div class="ch-detail-stat"><div class="val">${fmtNum(viewsPerVideo)}</div><div class="lbl">Vues/Video</div></div>
          <div class="ch-detail-stat"><div class="val">${uploadsPerMonth}/mois</div><div class="lbl">Frequence</div></div>
          <div class="ch-detail-stat"><div class="val">${avgEngagement}%</div><div class="lbl">Engagement</div></div>
        </div>

        <div class="ch-detail-section">
          <h4>🔥 Top Videos (Plus de vues)</h4>
          <div class="vid-grid">
            ${topVids.map(v => `
              <a class="vid-card" href="https://youtube.com/watch?v=${v.id}" target="_blank">
                <img src="${v.thumb}" alt="${v.title}" loading="lazy">
                <div class="vid-info">
                  <div class="vid-title">${v.title}</div>
                  <div class="vid-views">👁 ${v.viewsFmt} vues · ❤ ${fmtNum(v.likes)}</div>
                </div>
              </a>
            `).join('')}
          </div>
        </div>

        <div class="ch-detail-section">
          <h4>📅 Videos Recentes</h4>
          <div class="vid-grid">
            ${recentVids.map(v => `
              <a class="vid-card" href="https://youtube.com/watch?v=${v.id}" target="_blank">
                <img src="${v.thumb}" alt="${v.title}" loading="lazy">
                <div class="vid-info">
                  <div class="vid-title">${v.title}</div>
                  <div class="vid-views">👁 ${v.viewsFmt} · ${v.published ? new Date(v.published).toLocaleDateString('fr') : ''}</div>
                </div>
              </a>
            `).join('')}
          </div>
        </div>

        <div class="ch-detail-section">
          <h4>💰 Revenus Estimes (12 derniers mois) <span class="growth-badge growth-up">~$${fmtNum(totalEstRev)}/an</span></h4>
          <div class="rev-chart">
            ${revenue.map(r => `
              <div class="rev-bar" style="height:${Math.max((r.revenue / maxRev) * 100, 4)}%">
                <span class="rev-val">$${r.revenue}</span>
                <span class="rev-month">${r.month}</span>
              </div>
            `).join('')}
          </div>
          <div style="margin-top:28px;font-size:11px;color:var(--gray);text-align:center">
            Estimation basee sur RPM moyen $4/1000 vues. Les revenus reels varient selon la niche et la geo.
          </div>
        </div>

        <div class="ch-detail-section" style="border-bottom:none;display:flex;gap:10px;flex-wrap:wrap">
          <a href="${ch.url}" target="_blank" class="btn-search" style="font-size:12px;padding:8px 16px;text-decoration:none">🔗 Voir sur YouTube</a>
          <a href="https://socialblade.com/youtube/channel/${ch.id}" target="_blank" class="btn-search" style="font-size:12px;padding:8px 16px;background:var(--green);text-decoration:none">📊 Social Blade</a>
        </div>
      </div>`;

    document.getElementById(`detail-${idx}`)?.remove();

}

async function searchVideosForThumbnails(query, maxResults = 12) {
  const search = await ytFetch('/search', {
    part: 'snippet', type: 'video', q: query,
    maxResults, order: 'viewCount'
  });
  const ids = (search.items || []).map(i => i.id.videoId).join(',');
  if (!ids) return [];
  const stats = await ytFetch('/videos', { part: 'statistics,snippet', id: ids });
  return (stats.items || []).map(v => ({
    id: v.id,
    title: v.snippet.title,
    channel: v.snippet.channelTitle,
    thumb: v.snippet.thumbnails?.medium?.url || v.snippet.thumbnails?.high?.url,
    views: fmtNum(parseInt(v.statistics.viewCount || 0)),
    likes: fmtNum(parseInt(v.statistics.likeCount || 0)),
  }));
}

function buildChannelObj(ch) {
  const subs = parseInt(ch.statistics.subscriberCount || 0);
  const views = parseInt(ch.statistics.viewCount || 0);
  const videos = parseInt(ch.statistics.videoCount || 1);
  const avgViews = videos > 0 ? Math.round(views / videos) : 0;
  const rawScore = subs > 0 ? (avgViews / subs) * 10 : 0;
  const outlier = Math.round(rawScore * 10) / 10;
  const created = ch.snippet.publishedAt ? new Date(ch.snippet.publishedAt) : null;
  const daysSince = created ? Math.round((Date.now() - created) / 86400000) : 0;
  const banner = ch.brandingSettings?.image?.bannerExternalUrl || '';
  const country = ch.snippet?.country || '';
  const keywords = ch.brandingSettings?.channel?.keywords || '';
  return {
    id: ch.id,
    name: ch.snippet.title,
    desc: ch.snippet.description?.substring(0, 200) || '',
    avatar: ch.snippet.thumbnails?.medium?.url || ch.snippet.thumbnails?.default?.url,
    banner,
    country,
    keywords,
    subsNum: subs,
    subs: fmtNum(subs),
    avgViews,
    avgViewsFmt: fmtNum(avgViews),
    totalViews: views,
    videoCount: videos,
    daysSince,
    outlier,
    color: randomColor(ch.id),
    url: `https://youtube.com/channel/${ch.id}`
  };
}

function fmtNum(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toString();
}

const COLORS = ['#8b5cf6','#3b82f6','#10b981','#f59e0b','#ef4444','#6366f1','#ec4899','#14b8a6'];
function randomColor(id) { return COLORS[id.charCodeAt(4) % COLORS.length]; }

  results.sort((a,b) => (b[sortBy] - a[sortBy]) * sortDir);

  el.classList.add('active');
  filterMode = mode;
  renderAIList();
}

function setSortBy(key) {
  if (sortBy === key) { sortDir *= -1; } else { sortBy = key; sortDir = -1; }
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(`sort-${key}`);
  if (btn) btn.classList.add('active');
  renderAIList();
}

// ── CHANNEL CARD ────────────────────────────────────────────────────────────
function channelCard(c) {
  const bars = scoreColor(c.outlier);
  const filled = Math.min(4, Math.ceil(c.outlier / 2.5));
  return `
    <div class="ch-card" id="card-${c.id}">
      <div class="ch-head">
        <div class="ch-av" style="background:${c.color}">
          ${c.avatar ? `<img src="${c.avatar}" onerror="this.style.display='none'">` : c.name.charAt(0)}
        </div>
        <div>
          <div class="ch-name"><a href="${c.url}" target="_blank" style="color:var(--dark);text-decoration:none" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--dark)'">${c.name}</a></div>
          <div class="ch-subs">${c.subs} subscribers</div>
        </div>
        <span class="ai-tag">✨ AI Pick</span>
        <div class="ch-actions">
          <div class="ico-btn" title="Open YouTube" onclick="window.open('${c.url}','_blank')">↗</div>
          <div class="ico-btn" title="Expand videos" onclick="toggleVids('${c.id}',this)">▾</div>
        </div>
      </div>
      <div class="metrics">
        <div class="met"><div class="met-lbl">👁 Avg Views/Video</div><div class="met-val">${c.avgViewsFmt}</div></div>
        <div class="met"><div class="met-lbl">📅 Days Since Start</div><div class="met-val">${c.daysSince}</div></div>
        <div class="met"><div class="met-lbl">⬆ Uploads</div><div class="met-val">${c.videoCount}</div></div>
        <div class="met"><div class="met-lbl">⚡ Outlier Score</div>
          <div class="outlier-wrap">
            <div class="o-bars">${[0,1,2,3].map(i=>`<div class="o-bar ${i<filled?bars:''}"></div>`).join('')}</div>
            <span class="o-num">${c.outlier.toFixed(1)}×</span>
          </div>
        </div>
      </div>
      <div class="ch-vids" id="vids-${c.id}">
        <div class="vids-lbl">Top Videos <span style="color:var(--blue);cursor:pointer" onclick="window.open('${c.url}/videos','_blank')">→ View all</span></div>
        <div class="vids-grid" id="vids-grid-${c.id}"><div class="loading"><div class="spinner"></div> Loading videos...</div></div>
      </div>
    </div>`;
}

function scoreColor(s) { return s >= 3 ? 'red' : s >= 1.5 ? 'orange' : 'green'; }

function scoreBarsMini(s) {
  const c = scoreColor(s);
  const f = Math.min(4, Math.ceil(s/2.5));
  return `<div class="o-bars">${[0,1,2,3].map(i=>`<div class="o-bar" style="width:16px;height:5px;${i<f?`background:${c==='red'?'var(--red)':c==='orange'?'var(--orange)':'var(--green)'}`:''}" ></div>`).join('')}</div>`;
}

async function toggleVids(id, btn) {
  const el = document.getElementById(`vids-${id}`);
  if (!el) return;
  const isOpen = el.classList.contains('open');
  el.classList.toggle('open');
  btn.textContent = isOpen ? '▾' : '▴';
  if (!isOpen) {
    const grid = document.getElementById(`vids-grid-${id}`);
    if (grid && grid.querySelector('.spinner')) {
      try {

        if (!grid) return;

        grid.innerHTML = vids.map(v => `
          <div class="vid-item" onclick="window.open('https://youtube.com/watch?v=${v.id}','_blank')">

        if (grid) grid.innerHTML = `<div style="font-size:12px;color:var(--red)">${e.message}</div>`;

  }

async function loadTrackedChannels() {
  const el = document.getElementById('tracked-list');
  if (!el) return;
  if (!trackedChannels.length) {
    el.innerHTML = `<div class="empty"><h3>No channels tracked yet</h3><p>Enter a YouTube channel URL or @handle above to start tracking</p></div>`;

  }
  const viewsPerVideo = (ch) => ch.videoCount > 0 ? Math.round(ch.totalViews / ch.videoCount) : 0;
  const uploadsMonth = (ch) => ch.daysSince > 30 ? Math.round(ch.videoCount / (ch.daysSince / 30)) : ch.videoCount;
  const estRevYear = (ch) => {
    const monthlyViews = ch.daysSince > 0 ? (ch.totalViews / ch.daysSince) * 30 : 0;
    return Math.round((monthlyViews / 1000) * 4 * 12);
  };

  el.innerHTML = trackedChannels.map((ch, i) => `

          <span style="font-size:11px;color:var(--blue);font-weight:600;cursor:pointer">Voir detail ▼</span>

async function addTracked() {
  if (!YT_KEY) { alert('Add your YouTube API key first'); return; }
  const input = document.getElementById('track-in')?.value?.trim();
  if (!input) return;
  const btn = document.getElementById('track-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Adding...'; }
  try {
    const ch = await getChannelByUrl(input);
    if (trackedChannels.find(t => t.id === ch.id)) {
      alert('Channel already tracked!');
    } else {
      trackedChannels.push(ch);
      localStorage.setItem('tracked_channels', JSON.stringify(trackedChannels));
      document.getElementById('track-in').value = '';
      loadTrackedChannels();
    }
  } catch(e) {
    alert('Error: ' + e.message);
  }
  if (btn) { btn.disabled = false; btn.textContent = '+ Add Channel'; }
}

async function refreshTracked(i) {
  if (!YT_KEY) return;
  try {
    const ch = await getChannelById(trackedChannels[i].id);
    trackedChannels[i] = ch;
    localStorage.setItem('tracked_channels', JSON.stringify(trackedChannels));
    loadTrackedChannels();
  } catch(e) { alert('Error refreshing: ' + e.message); }
}

function removeTracked(i) {
  trackedChannels.splice(i, 1);
  localStorage.setItem('tracked_channels', JSON.stringify(trackedChannels));
  loadTrackedChannels();
}

function calcRPM() {
  const nicheSel = document.getElementById('rpm-niche')?.value;
  const views = parseInt(document.getElementById('rpm-views')?.value || 0);
  const geo = parseFloat(document.getElementById('rpm-geo')?.value || 1);
  const niche = RPM_DATA.find(r => r.niche === nicheSel);
  if (!niche || !views) return;
  const low = (niche.rpm_low * geo * views / 1000).toFixed(0);
  const high = (niche.rpm_high * geo * views / 1000).toFixed(0);
  const avgRPM = ((niche.rpm_low + niche.rpm_high) / 2 * geo).toFixed(1);
  document.getElementById('rpm-val').textContent = `$${parseInt(low).toLocaleString()} – $${parseInt(high).toLocaleString()}`;
  document.getElementById('rpm-lbl').textContent = `Estimated monthly revenue · Avg RPM: $${avgRPM} · Based on ${views.toLocaleString()} monthly views`;
}

function downloadWorkflow(name) {
  const data = WF_JSON_DATA[name] || {name,nodes:[],connections:{}};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name.replace(/\s+/g,'-').toLowerCase() + '.n8n.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
